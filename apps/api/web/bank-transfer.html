<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay by Bank Transfer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f1e8;color:#1a1a1a}
header{background:#0b5c3b;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header a{color:#d4af37;font-weight:bold;text-decoration:none;font-size:14px}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 4px}
select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;font-size:15px}
button{background:#0b5c3b;color:#fff;border:0;border-radius:7px;padding:12px 16px;font-size:15px;font-weight:bold;margin-top:14px;cursor:pointer}
.bank{background:#f3f7f5;border:1px dashed #0b5c3b;border-radius:8px;padding:12px;margin:8px 0;font-size:15px;line-height:1.7}
.m{padding:10px;border-radius:7px;margin-top:10px;display:none;font-size:14px}
.ok{background:#e4f5ea;color:#0b5c3b}.er{background:#fde8e6;color:#b3261e}
small{color:#666}
</style></head><body>
<header><b>Pay by Bank Transfer</b><a href="payments.html">&larr; Payments</a></header>
<main>
<div class="card" id="step1">
  <h3 style="margin-top:0">1. Transfer the course fee</h3>
  <div id="bank">Loading...</div>
  <label>Course</label><select id="course"></select>
  <div id="amt" style="font-weight:bold;margin-top:8px"></div>
  <small>Transfer exactly this amount to the account above, then continue.</small><br>
  <button id="start">I have paid - continue</button>
</div>
<div class="card" id="step2" style="display:none">
  <h3 style="margin-top:0">2. Upload proof of payment</h3>
  <p id="ref"></p>
  <label>Photo of receipt / screenshot (JPG, PNG) or PDF</label>
  <input id="file" type="file" accept="image/*,application/pdf">
  <button id="send">Upload proof</button>
  <div class="m" id="msg"></div>
  <small style="display:block;margin-top:10px">The academy will confirm your payment, then you are enrolled automatically and can download a receipt.</small>
</div>
</main>
<script>
function $(i){return document.getElementById(i);}
function say(t,ok){var m=$("msg");m.textContent=t;m.className="m "+(ok?"ok":"er");m.style.display="block";}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
async function call(path,opt){
  opt=opt||{};opt.credentials="include";
  if(opt.json){opt.headers={"Content-Type":"application/json"};opt.body=JSON.stringify(opt.json);}
  var r=await fetch("/api"+path,opt);var d=await r.json().catch(function(){return{};});
  if(!r.ok)throw new Error(d.message||"Request failed.");return d;
}
var courses=[],payId=new URLSearchParams(location.search).get("pay");
function money(n){return "NGN "+Number(n).toLocaleString("en-NG");}
function showStep2(p){$("step1").style.display="none";$("step2").style.display="block";$("ref").innerHTML="Payment reference: <b>"+esc(p.reference||"")+"</b>";}
async function init(){
  try{
    var d=await call("/payments/bank/info");
    var b=d.bank||(d.data&&d.data.bank)||{};courses=d.courses||(d.data&&d.data.courses)||[];
    $("bank").innerHTML=b.accountNumber?('<div class="bank">Bank: <b>'+esc(b.bankName)+'</b><br>Account name: <b>'+esc(b.accountName)+'</b><br>Account number: <b>'+esc(b.accountNumber)+'</b></div>'):'<div class="bank">Bank details have not been set yet. Please contact the academy.</div>';
    $("course").innerHTML=courses.map(function(c){return '<option value="'+c.id+'">'+esc(c.title)+'</option>';}).join("")||'<option value="">No course to pay for</option>';
    $("course").onchange=amt;amt();
    if(payId)showStep2({reference:""});
  }catch(e){$("bank").textContent=e.message;}
}
function amt(){var c=courses.filter(function(x){return x.id===$("course").value})[0];$("amt").textContent=c?"Amount: "+money(c.price):"";}
$("start").onclick=async function(){
  try{
    var c=$("course").value;if(!c)throw new Error("Choose a course.");
    var d=await call("/payments/bank/start",{method:"POST",json:{courseId:c}});
    var p=d.payment||(d.data&&d.data.payment);payId=p.id;showStep2(p);
  }catch(e){alert(e.message);}
};
function shrink(file){
  return new Promise(function(res,rej){
    if(file.type==="application/pdf"){res(file);return;}
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){b?res(b):rej(new Error("Could not read the image."));},"image/jpeg",0.82);
    };
    img.onerror=function(){rej(new Error("Could not read the image."));};img.src=u;
  });
}
$("send").onclick=async function(){
  try{
    var f=$("file").files[0];if(!f)throw new Error("Choose a file first.");
    var blob=await shrink(f);
    var r=await fetch("/api/payments/bank/"+payId+"/proof",{method:"POST",credentials:"include",headers:{"Content-Type":blob.type},body:blob});
    var d=await r.json().catch(function(){return{};});
    if(!r.ok)throw new Error(d.message||"Upload failed.");
    say("Proof uploaded. We will confirm your payment shortly.",true);
  }catch(e){say(e.message,false);}
};
init();
</script></body></html>
