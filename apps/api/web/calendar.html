<!doctype html>
<html lang="en"><head>
<script src="/theme.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academic Calendar | MAKNAZUL IRFAN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f5f8f6;color:#17251e}
header{background:#064e3b;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-size:14px}
main{width:94%;max-width:820px;margin:22px auto}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
h2{color:#064e3b;font-size:18px;margin-bottom:8px}h3{color:#064e3b;font-size:16px;margin:14px 0 6px}
.sub{color:#68756d;font-size:13px;line-height:1.5}
label{display:block;margin:10px 0 4px;font-weight:bold;font-size:14px}
input,select{width:100%;padding:10px;border:1px solid #ccd8d1;border-radius:7px;font-size:15px}
button{padding:11px 18px;border:0;border-radius:7px;background:#d4af37;font-weight:bold;font-size:15px;margin-top:14px;cursor:pointer}
button.del{background:#fdecec;color:#a12626;margin:0;padding:5px 9px;font-size:12px}
a.btn{display:inline-block;background:#064e3b;color:#fff;text-decoration:none;font-weight:bold;padding:9px 14px;border-radius:7px;font-size:14px}
.m{display:none;padding:10px;border-radius:7px;margin-bottom:10px;font-size:14px}.ok{display:block;background:#e8f7ed;color:#176b3a}.er{display:block;background:#fdecec;color:#a12626}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #e3ebe6;vertical-align:top}th{color:#064e3b}
.tag{display:inline-block;background:#e8f7ed;color:#064e3b;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:bold}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2>div{flex:1;min-width:140px}
#adm{display:none}
</style><script src="/presence.js" defer></script>
</head><body>
<header><b>Academic Calendar</b><a id="back" href="login.html">&larr; Back</a></header>
<main>
<div class="card"><p style="margin-bottom:10px"><a class="btn" href="/api/pdf/calendar">Download Calendar (PDF)</a></p><div id="list"><p class="sub">Loading...</p></div></div>
<div class="card" id="adm"><h2>Add an event (admin)</h2><div id="msg" class="m"></div>
<form id="f">
<div class="row2"><div><label>Session (e.g. 2026/2027)</label><input id="se" required></div><div><label>Term (optional)</label><input id="te" placeholder="First Term"></div></div>
<label>Title</label><input id="ti" required placeholder="Resumption for First Term">
<label>Type</label><select id="ty"><option value="RESUMPTION">Resumption</option><option value="CLOSING">Closing</option><option value="EXAM">Exam</option><option value="HOLIDAY">Holiday</option><option value="EVENT">Event</option></select>
<div class="row2"><div><label>Start date</label><input id="sd" type="date" required></div><div><label>End date (optional)</label><input id="ed" type="date"></div></div>
<label>Note (optional)</label><input id="de">
<button type="submit" id="b">Add event</button></form></div>
</main>
<script>
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function say(t,ok){var m=$("msg");m.textContent=t;m.className="m "+(ok?"ok":"er");}
function dt(d){return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}
var isAdmin=false;
async function api(p,o){o=o||{};o.credentials="include";if(o.body)o.headers={"Content-Type":"application/json"};
  var r=await fetch("/api/plan"+p,o);if(r.status===401){location.href="login.html";throw new Error("Please log in.");}
  var d=await r.json().catch(function(){return{};});if(!r.ok)throw new Error(d.message||"Request failed.");return d;}
async function load(){
  try{var d=await api("/calendar");var ev=d.events||[];
    if(!ev.length){$("list").innerHTML='<p class="sub">No events have been added yet.</p>';return;}
    var sessions=[];ev.forEach(function(e){if(sessions.indexOf(e.session)<0)sessions.push(e.session);});
    $("list").innerHTML=sessions.map(function(s){
      return '<h3>'+esc(s)+' Session</h3><div class="tw"><table><tr><th>Date</th><th>Event</th><th>Type</th>'+(isAdmin?'<th></th>':'')+'</tr>'
      +ev.filter(function(e){return e.session===s;}).map(function(e){
        var date=e.endDate&&e.endDate!==e.startDate?dt(e.startDate)+' - '+dt(e.endDate):dt(e.startDate);
        return '<tr><td>'+date+'</td><td>'+esc(e.title)+(e.term?' <span class="sub">('+esc(e.term)+')</span>':'')+(e.description?'<div class="sub">'+esc(e.description)+'</div>':'')+'</td><td><span class="tag">'+esc(e.type.charAt(0)+e.type.slice(1).toLowerCase())+'</span></td>'+(isAdmin?'<td><button class="del" data-id="'+esc(e.id)+'">Delete</button></td>':'')+'</tr>';
      }).join("")+'</table></div>';}).join("");
  }catch(e){$("list").innerHTML='<p class="sub">'+esc(e.message)+'</p>';}}
$("list").addEventListener("click",async function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-id");if(!id||!confirm("Delete this event?"))return;
  try{await api("/calendar/"+encodeURIComponent(id),{method:"DELETE"});load();}catch(x){alert(x.message);}});
$("f").addEventListener("submit",async function(e){e.preventDefault();$("b").disabled=true;
  try{await api("/calendar",{method:"POST",body:JSON.stringify({session:$("se").value,term:$("te").value,title:$("ti").value,type:$("ty").value,startDate:$("sd").value,endDate:$("ed").value,description:$("de").value})});
    say("Event added.",true);var s=$("se").value,t=$("te").value;$("f").reset();$("se").value=s;$("te").value=t;load();}catch(x){say(x.message,false);}$("b").disabled=false;});
(async function(){
  try{var r=await fetch("/api/auth/me",{credentials:"include"});var d=await r.json();var u=d.user||(d.data&&d.data.user)||d.data||d;
    var role=u&&u.role;isAdmin=role==="ADMIN";
    $("back").href=role==="ADMIN"?"admin.html":role==="TEACHER"?"teacher.html":role==="PARENT"?"parent.html":"student.html";
    if(isAdmin)$("adm").style.display="block";}catch(e){}
  load();
})();
</script></body></html>
