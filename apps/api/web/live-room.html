<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Class Room</title>
<style>
html,body{margin:0;height:100%;background:#0f1d17;font-family:Arial,sans-serif;color:#fff}
#bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0b5c3b;font-size:14px}
#bar a{color:#d4af37;text-decoration:none;font-weight:bold}
#room{height:calc(100% - 44px)}
#msg{padding:30px 18px;text-align:center;font-size:15px}
</style></head><body>
<div id="bar"><span id="title">Live Class</span><a href="live-classes.html">&larr; Back</a></div>
<div id="room"><div id="msg">Loading class...</div></div>
<script>
(async function(){
  var msg=document.getElementById("msg");
  function fail(t){msg.textContent=t;}
  try{
    var id=new URLSearchParams(location.search).get("id");
    if(!id) return fail("No class selected.");
    var r=await fetch("/api/live-classes/"+encodeURIComponent(id),{credentials:"include"});
    var d=await r.json().catch(function(){return{};});
    if(!r.ok) return fail(d.message||"You cannot open this class.");
    var c=d.data&&d.data.liveClass?d.data.liveClass:(d.data||d);
    var url=c.meetingUrl;
    if(!url) return fail("This class has no meeting room yet.");
    document.getElementById("title").textContent=c.title||"Live Class";
    var u=new URL(url);
    var room=u.pathname.replace(/^\//,"");
    var me=await fetch("/api/auth/me",{credentials:"include"}).then(function(x){return x.json();}).catch(function(){return{};});
    var user=(me.data&&me.data.user)||me.user||me.data||{};
    var name=((user.firstName||"")+" "+(user.lastName||"")).trim()||"Student";
    if(u.hostname!=="meet.jit.si"&&!/jit/i.test(u.hostname)){ location.href=url; return; }
    var s=document.createElement("script");
    s.src="https://"+u.hostname+"/external_api.js";
    s.onload=function(){
      msg.remove();
      new JitsiMeetExternalAPI(u.hostname,{
        roomName:room,parentNode:document.getElementById("room"),width:"100%",height:"100%",
        userInfo:{displayName:name},
        configOverwrite:{prejoinPageEnabled:false,subject:c.title||"Live Class"}
      });
    };
    s.onerror=function(){fail("Could not load the video room. Opening in a new tab...");window.open(url,"_blank");};
    document.body.appendChild(s);
  }catch(e){fail("Could not open the class.");}
})();
</script></body></html>
