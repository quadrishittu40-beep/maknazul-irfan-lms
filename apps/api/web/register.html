<!DOCTYPE html><html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#064e3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maknazul Irfan">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icon-192.png">
<script src="/pwa.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Student Registration | MAKNAZUL IRFAN</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f8f6;
      color: #17251e;
      min-height: 100vh;
    }

    header {
      background: #064e3b;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .logo span {
      display: block;
      font-size: 12px;
      font-weight: normal;
      color: #d8f3dc;
      margin-top: 3px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    header a:hover {
      color: #d4af37;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 50px auto;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      color: #064e3b;
      text-align: center;
      margin-bottom: 8px;
    }

    .intro {
      text-align: center;
      color: #68756d;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #263b31;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd8d1;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #087f5b;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #d4af37;
      color: #102018;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e8f7ed;
      color: #176b3a;
      border: 1px solid #b8dfc5;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #a12626;
      border: 1px solid #efb8b8;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #68756d;
    }

    .login-link a {
      color: #064e3b;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .card {
        padding: 25px 20px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style></head><body><header>  <div class="logo">
    MAKNAZUL IRFAN
    <span>Online Islamic & Arabic Institute</span>
  </div>  <a href="index.html">
    ← Back to Home
  </a></header><main class="container">  <div class="card"><h1>Student Registration</h1>

<p class="intro">
  Create your MAKNAZUL IRFAN student account.
</p>

<div id="message" class="message"></div>

<form id="registerForm">

  <div class="row">

    <div class="form-group">
      <label for="firstName">First Name</label>

      <input
        type="text"
        id="firstName"
        name="firstName"
        required
        autocomplete="given-name"
      >
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>

      <input
        type="text"
        id="lastName"
        name="lastName"
        required
        autocomplete="family-name"
      >
    </div>

  </div>

  <div class="form-group">

    <label for="email">
      Email Address
    </label>

    <input
      type="email"
      id="email"
      name="email"
      required
      autocomplete="email"
    >

  </div>

  <div class="form-group">

    <label for="phone">
      Phone Number
    </label>

    <input
      type="tel"
      id="phone"
      name="phone"
      autocomplete="tel"
    >

  </div>

  <div class="row">

    <div class="form-group">

      <label for="dateOfBirth">
        Date of Birth
      </label>

      <input
        type="date"
        id="dateOfBirth"
        name="dateOfBirth"
      >

    </div>

    <div class="form-group">

      <label for="gender">
        Gender
      </label>

      <select id="gender" name="gender">

        <option value="">
          Select gender
        </option>

        <option value="Male">
          Male
        </option>

        <option value="Female">
          Female
        </option>

      </select>

    </div>

  </div>

  <div class="form-group">

    <label for="levelId">
      Level
    </label>

    <select id="levelId" name="levelId">

      <option value="">
        Select level
      </option>

    </select>

  </div>

  <div class="form-group">

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      name="password"
      required
      minlength="8"
      autocomplete="new-password"
    >

  </div>

  <div class="form-group">

    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      name="confirmPassword"
      required
      minlength="8"
      autocomplete="new-password"
    >

  </div>

  <button
    type="submit"
    id="registerButton"
  >
    Create Student Account
  </button>

</form>

<div class="login-link">

  Already have an account?

  <a href="login.html">
    Student Login
  </a>

</div>

  </div></main><script>

const form = document.getElementById("registerForm");

fetch("/api/academic/levels")
  .then(r => r.json())
  .then(res => {
    const levels = res.levels || (res.data && res.data.levels) || [];
    const select = document.getElementById("levelId");
    levels.forEach(l => {
      const o = document.createElement("option");
      o.value = l.id;
      o.textContent = l.name;
      select.appendChild(o);
    });
  })
  .catch(() => {});
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

function showMessage(text, type) {

  message.textContent = text;
  message.className = "message " + type;

}

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {

    showMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }

  const data = {

    firstName:
      document.getElementById("firstName").value.trim(),

    lastName:
      document.getElementById("lastName").value.trim(),

    email:
      document.getElementById("email").value.trim(),

    password: password

  };

  const phone =
    document.getElementById("phone").value.trim();
  const dateOfBirth =
    document.getElementById("dateOfBirth").value;
  const gender =
    document.getElementById("gender").value;
  const levelId =
    document.getElementById("levelId").value;

  if (phone) data.phone = phone;
  if (dateOfBirth) data.dateOfBirth = dateOfBirth;
  if (gender) data.gender = gender;
  if (levelId) data.levelId = levelId;

  button.disabled = true;
  button.textContent = "Creating Account...";

  try {

    const response = await fetch("/api/auth/register", {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },

      body: JSON.stringify(data)

    });

    /*
     * Read the response as text first.
     * This prevents "Unexpected end of JSON input"
     * when the server returns an empty response.
     */

    const responseText = await response.text();

    let result = {};

    if (responseText.trim()) {

      try {

        result = JSON.parse(responseText);

      } catch (parseError) {

        throw new Error(
          "The server returned an invalid response."
        );

      }

    }

    if (!response.ok) {

      throw new Error(
        result.message ||
        `Registration failed. Server returned ${response.status}.`
      );

    }

    showMessage(
      result.message ||
      "Registration successful. You can now log in.",
      "success"
    );

    form.reset();

    setTimeout(() => {

      window.location.href = "login.html";

    }, 2000);

  } catch (error) {

    console.error("Registration error:", error);

    showMessage(
      error.message ||
      "Unable to register. Please try again.",
      "error"
    );

  } finally {

    button.disabled = false;
    button.textContent = "Create Student Account";

  }

});

</script></body>
</html>
