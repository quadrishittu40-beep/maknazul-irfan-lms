<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admission Fee</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f1e8;color:#1a1a1a}
header{background:#0b5c3b;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header a{color:#d4af37;font-weight:bold;text-decoration:none;font-size:14px}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
button,.btn{display:block;width:100%;text-align:center;background:#0b5c3b;color:#fff;border:0;border-radius:8px;padding:13px 16px;font-size:15px;font-weight:bold;margin-top:12px;cursor:pointer;text-decoration:none}
.alt{background:#d4af37;color:#1a1a1a}
.bank{background:#f3f7f5;border:1px dashed #0b5c3b;border-radius:8px;padding:12px;margin:8px 0;line-height:1.7}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;font-size:15px;margin-top:8px}
.m{padding:10px;border-radius:7px;margin-top:10px;display:none;font-size:14px}
.ok{background:#e4f5ea;color:#0b5c3b}.er{background:#fde8e6;color:#b3261e}
.big{font-size:28px;font-weight:bold;color:#0b5c3b}
small{color:#666}
</style></head><body>
<header><b>Admission Fee</b><a href="student.html">&larr; Dashboard</a></header>
<main>
<div class="card"><div>Admission fee</div><div class="big" id="amount">NGN 10,000</div><div id="status" style="margin-top:6px"></div><div id="paid"></div></div>
<div class="card" id="pay" style="display:none">
  <h3 style="margin-top:0">Pay now</h3>
  <button id="card">Pay with card / Paystack</button>
  <button class="alt" id="bankBtn">Pay by bank transfer</button>
  <div id="bankBox" style="display:none">
    <div id="bank" class="bank"></div>
    <small>Transfer exactly the amount above, then upload your receipt.</small>
    <input id="file" type="file" accept="image/*,application/pdf">
    <button id="send">Upload proof of payment</button>
  </div>
  <div class="m" id="msg"></div>
</div>
</main>
<script>
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function say(t,ok){var m=$("msg");m.textContent=t;m.className="m "+(ok?"ok":"er");m.style.display="block";}
async function call(path,opt){
  opt=opt||{};opt.credentials="include";
  if(opt.json){opt.headers={"Content-Type":"application/json"};opt.body=JSON.stringify(opt.json);}
  var r=await fetch("/api/admission"+path,opt);var d=await r.json().catch(function(){return{};});
  if(!r.ok)throw new Error(d.message||"Request failed.");return d;
}
async function load(){
  try{
    var d=await call("/me"),fee=d.fee,bank=d.bank||{};
    $("amount").textContent="NGN "+Number(d.amount).toLocaleString("en-NG");
    var st=fee?fee.status:"UNPAID";
    $("status").innerHTML="Status: <b>"+(st==="PAID"?"PAID":st==="PENDING"&&fee.hasProof?"Waiting for confirmation":st==="CANCELLED"?"Not confirmed - please pay again":"Not paid yet")+"</b>";
    if(st==="PAID"){
      $("paid").innerHTML='<a class="btn" href="/api/pdf/receipt/admission/'+fee.id+'">Download Receipt (PDF)</a>';
      $("pay").style.display="none";
    }else{
      $("pay").style.display="block";
      $("bank").innerHTML=bank.accountNumber?('Bank: <b>'+esc(bank.bankName)+'</b><br>Account name: <b>'+esc(bank.accountName)+'</b><br>Account number: <b>'+esc(bank.accountNumber)+'</b>'):'Bank details have not been set yet. Please contact the academy.';
    }
  }catch(e){$("status").textContent=e.message;}
}
async function verify(ref){
  try{await call("/verify/"+encodeURIComponent(ref));}catch(e){say(e.message,false);$("pay").style.display="block";}
  history.replaceState(null,"","admission.html");load();
}
$("card").onclick=async function(){
  try{var d=await call("/card",{method:"POST"});location.href=d.authorizationUrl;}catch(e){say(e.message,false);}
};
$("bankBtn").onclick=async function(){
  try{await call("/bank",{method:"POST"});$("bankBox").style.display="block";}catch(e){say(e.message,false);}
};
function shrink(file){
  return new Promise(function(res,rej){
    if(file.type==="application/pdf"){res(file);return;}
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){b?res(b):rej(new Error("Could not read the image."));},"image/jpeg",0.82);
    };
    img.onerror=function(){rej(new Error("Could not read the image."));};img.src=u;
  });
}
$("send").onclick=async function(){
  try{
    var f=$("file").files[0];if(!f)throw new Error("Choose a file first.");
    var blob=await shrink(f);
    var r=await fetch("/api/admission/bank/proof",{method:"POST",credentials:"include",headers:{"Content-Type":blob.type},body:blob});
    var d=await r.json().catch(function(){return{};});
    if(!r.ok)throw new Error(d.message||"Upload failed.");
    say("Proof uploaded. We will confirm your payment shortly.",true);load();
  }catch(e){say(e.message,false);}
};
var q=new URLSearchParams(location.search),ref=q.get("reference")||q.get("trxref");
if(ref)verify(ref);else load();
</script></body></html>
